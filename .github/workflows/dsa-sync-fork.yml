# Student forks only: pulls the newest lessons from the course repository
# every day, so you don't have to click "Sync fork" yourself.
# Does nothing in the course repository itself.
#
# If it fails (e.g. you edited a file the course also changed, or the course
# updated its workflow files), open your fork on GitHub and click
# "Sync fork" -> "Update branch".
name: Sync Fork

on:
  schedule:
    # 7:00 AM IST (after the 6:00 AM lesson) and 9:00 AM IST (after the
    # 8:00 AM backup run). Syncing when nothing is new is harmless.
    - cron: "30 1 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Pull new lessons from the course
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Merge the course repository into this fork
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if result="$(gh api -X POST "repos/${REPO}/merge-upstream" -f branch="${BRANCH}" --jq '.message')"; then
            echo "::notice::${result}"
          else
            echo "::error::Automatic sync failed. On GitHub, open your fork and click 'Sync fork' -> 'Update branch'."
            exit 1
          fi
